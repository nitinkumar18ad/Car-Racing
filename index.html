<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Circuit — 3D Racing</title>
<link rel="stylesheet" href="css/style.css">

<!--
  three.js is vendored into vendor/three/ so the game works offline.
  three.module.js imports './three.core.js' relatively, so both files must stay
  side by side. To use the CDN instead, swap the mapping below for:
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"
-->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/loaders/GLTFLoader.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="scene"></canvas>

<!-- ── Loading ───────────────────────────────────────────────────────────── -->
<div id="loading" class="overlay">
  <div class="loading-inner">
    <div class="loading-title">LOADING..</div>
    <div class="loading-bar"><span></span></div>
    <div class="loading-note">building track…</div>
  </div>
</div>

<!-- ── HUD ───────────────────────────────────────────────────────────────── -->
<div id="hud" class="hidden">

  <!-- Lap / timing, top left -->
  <div class="panel panel-timing">
    <div class="mode-row">
      <span class="label">MODE</span>
      <button id="mode-button" class="mode-button" type="button">Circuit</button>
    </div>
    <div class="lap-row">
      <span class="label" id="lap-label">LAP</span>
      <span class="lap-count"><b id="lap-current">1</b><i>/</i><span id="lap-total">3</span></span>
    </div>
    <div class="time-big" id="time-current">0:00.000</div>
    <div class="time-row">
      <span class="label">LAST</span><span id="time-last">—</span>
    </div>
    <div class="time-row">
      <span class="label">BEST</span><span id="time-best">—</span>
    </div>
    <div class="delta" id="delta"></div>
  </div>

  <!-- Minimap, top right -->
  <div class="panel panel-map">
    <canvas id="minimap" width="200" height="200"></canvas>
  </div>

  <!-- Speedometer, bottom right -->
  <div class="panel panel-speed">
    <div class="speed-readout">
      <span id="speed-value">0</span>
      <small>KM/H</small>
    </div>
    <div class="gear" id="gear">N</div>
  </div>

  <!-- Surface warning -->
  <div class="offroad" id="offroad">OFF TRACK</div>

  <!-- Controls reminder, bottom left -->
  <div class="panel panel-keys">
    <div><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> <span>or</span> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> drive</div>
    <div><kbd>Space</kbd> handbrake &nbsp; <kbd>C</kbd>camera</div>
    <div><kbd>M</kbd> mode &nbsp; <kbd>R</kbd> restart &nbsp; <kbd>P</kbd> pause</div>
  </div>

</div>

<!-- ── Countdown ─────────────────────────────────────────────────────────── -->
<div id="countdown" class="hidden"><span id="countdown-text">3</span></div>

<!-- ── Paused ────────────────────────────────────────────────────────────── -->
<div id="paused" class="overlay hidden">
  <div class="card">
    <h2>Paused</h2>
    <p>Press <kbd>P</kbd> to resume, or <kbd>R</kbd> to restart the race.</p>
  </div>
</div>

<!-- ── Results ───────────────────────────────────────────────────────────── -->
<div id="results" class="overlay hidden">
  <div class="card">
    <h2 id="results-title">Race Complete</h2>
    <table class="results-table"><tbody id="results-rows"></tbody></table>
    <div class="results-total">
      <span class="label">TOTAL</span><span id="results-total">—</span>
    </div>
    <div class="results-best" id="results-best"></div>
    <p class="results-hint">Press <kbd>R</kbd> to race again</p>
  </div>
</div>

<!-- ── Fatal error (e.g. no WebGL) ───────────────────────────────────────── -->
<div id="fatal" class="overlay hidden">
  <div class="card">
    <h2>Can't start the game </h2>
    <p id="fatal-message"></p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
