<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a35" />
      <stop offset="100%" stop-color="#cc0022" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#222834" stroke-width="2" />
  
  <!-- Checkered Flag pattern on top right -->
  <path d="M 36 12 L 52 12 L 48 24 L 32 24 Z" fill="#ffffff" opacity="0.9" />
  <rect x="36" y="12" width="4" height="6" fill="#111317" />
  <rect x="44" y="12" width="4" height="6" fill="#111317" />
  <rect x="34" y="18" width="4" height="6" fill="#111317" />
  <rect x="42" y="18" width="4" height="6" fill="#111317" />
  <rect x="50" y="18" width="2" height="6" fill="#111317" />
  
  <!-- Apex Racing Curve Line -->
  <path d="M 10 52 C 14 36, 26 22, 50 18" fill="none" stroke="url(#apexGrad)" stroke-width="5" stroke-linecap="round" />
  <path d="M 12 55 C 16 40, 28 26, 52 22" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Speed Needle Accent -->
  <circle cx="28" cy="36" r="4" fill="#ffffff" />
</svg>
